<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base Card -->
  <rect width="600" height="700" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative medical cross grid in background -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="2">
    <path d="M50 100 h30 M65 85 v30 M520 120 h30 M535 105 v30 M80 580 h30 M95 565 v30 M500 560 h30 M515 545 v30"/>
  </g>

  <!-- Concentric Halo Behind Doctor -->
  <circle cx="300" cy="280" r="180" fill="#ffffff" opacity="0.8"/>
  <circle cx="300" cy="280" r="150" fill="none" stroke="#e0f2fe" stroke-width="3"/>
  <circle cx="300" cy="280" r="130" fill="#f0f9ff" opacity="0.7"/>

  <!-- Top Clinic Monogram Seal -->
  <g transform="translate(300, 70)" text-anchor="middle">
    <circle cx="0" cy="0" r="32" fill="url(#navyGrad)" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M-9 -4 C-9 -10 -2 -13 0 -6 C2 -13 9 -10 9 -4 C9 4 0 11 0 11 C0 11 -9 4 -9 -4 Z" fill="url(#roseGrad)"/>
    <text y="2" font-family="'Poppins', sans-serif" font-weight="700" font-size="11" fill="#ffffff" dy="18">GHC</text>
  </g>

  <!-- Doctor Illustration -->
  <g id="doctorFigure">
    <!-- Shoulders & Clinical White Coat -->
    <path d="M140 520 C140 430, 200 370, 240 355 L255 350 L275 420 L300 425 L325 420 L345 350 L360 355 C400 370, 460 430, 460 520 Z" fill="url(#coatGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Inner Shirt & Tie -->
    <!-- Light Blue Medical Shirt -->
    <polygon points="255,350 345,350 325,430 275,430" fill="#e0f2fe"/>
    <!-- Deep Navy Silk Tie -->
    <polygon points="295,360 305,360 310,380 304,440 300,448 296,440 290,380" fill="url(#navyGrad)"/>
    <polygon points="293,356 307,356 305,366 295,366" fill="#1e40af"/>

    <!-- Doctor White Coat Lapels -->
    <path d="M240 355 L285 460 L245 460 L220 390 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M360 355 L315 460 L355 460 L380 390 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Doctor Neck & Face Base -->
    <rect x="275" y="305" width="50" height="50" rx="8" fill="#e2c5aa"/>
    <ellipse cx="300" cy="270" rx="65" ry="78" fill="#eacbb2"/>

    <!-- Professional Hair Style -->
    <path d="M235 250 C235 190, 270 175, 300 175 C330 175, 365 190, 365 250 C365 230, 350 200, 300 200 C250 200, 235 230, 235 250 Z" fill="#1e293b"/>
    <!-- Gentle temples hair trim -->
    <path d="M235 250 C234 265, 238 280, 240 288 C242 280, 242 260, 245 250 Z" fill="#1e293b"/>
    <path d="M365 250 C366 265, 362 280, 360 288 C358 280, 358 260, 355 250 Z" fill="#1e293b"/>

    <!-- Eyebrows & Eyes (Gentle, Experienced, Dignified) -->
    <path d="M260 245 Q275 240 288 245" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M312 245 Q325 240 340 245" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="274" cy="256" r="5" fill="#1e293b"/>
    <circle cx="276" cy="254" r="1.5" fill="#ffffff"/>
    <circle cx="326" cy="256" r="5" fill="#1e293b"/>
    <circle cx="328" cy="254" r="1.5" fill="#ffffff"/>

    <!-- Glasses (Refined Titanium Half-Rim) -->
    <rect x="256" y="246" width="36" height="22" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
    <rect x="308" y="246" width="36" height="22" rx="6" fill="none" stroke="#475569" stroke-width="2"/>
    <line x1="292" y1="254" x2="308" y2="254" stroke="#475569" stroke-width="2"/>
    <path d="M256 252 L242 249 M344 252 L358 249" stroke="#475569" stroke-width="1.5"/>

    <!-- Nose & Warm Smile -->
    <path d="M300 256 L298 278 Q300 282 305 280" stroke="#c9a88d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M282 296 Q300 312 318 296" stroke="#b45309" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Professional Stethoscope around neck -->
    <path d="M262 355 C260 410, 270 470, 276 490 C280 500, 290 500, 292 485 L288 430" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M338 355 C340 410, 330 470, 324 490 C320 500, 310 500, 308 485 L312 430" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Stethoscope Chest Piece / Diaphragm -->
    <circle cx="282" cy="510" r="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="282" cy="510" r="8" fill="#0284c7"/>
  </g>

  <!-- Floating Verified Credential Pill (Left) -->
  <g transform="translate(40, 400)" filter="url(#cardShadow)">
    <rect width="170" height="52" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="30" cy="26" r="16" fill="#ecfdf5"/>
    <path d="M24 26 L28 30 L37 21" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="22" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0f172a">15+ Years</text>
    <text x="56" y="38" font-family="'Poppins', sans-serif" font-weight="500" font-size="10" fill="#64748b">Cardio-Physician</text>
  </g>

  <!-- Floating Education Badge (Right) -->
  <g transform="translate(390, 420)" filter="url(#cardShadow)">
    <rect width="170" height="52" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="30" cy="26" r="16" fill="#eff6ff"/>
    <path d="M20 23 L30 18 L40 23 L30 28 Z M24 26 V32 C24 35, 36 35, 36 32 V26" stroke="#2563eb" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="56" y="22" font-family="'Poppins', sans-serif" font-weight="700" font-size="12" fill="#0f172a">UN Mehta Inst.</text>
    <text x="56" y="38" font-family="'Poppins', sans-serif" font-weight="500" font-size="10" fill="#64748b">Diploma Cardiology</text>
  </g>

  <!-- Bottom Identity Plaque -->
  <g transform="translate(50, 550)" filter="url(#shadow)">
    <rect width="500" height="115" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Top colored accent line -->
    <path d="M50 0 h400" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Doctor Name -->
    <text x="250" y="38" font-family="'Poppins', sans-serif" font-weight="800" font-size="20" fill="#0f172a" text-anchor="middle" letter-spacing="-0.3">
      Dr. Gurjeet Singh Gill
    </text>
    
    <!-- Designation -->
    <text x="250" y="60" font-family="'Poppins', sans-serif" font-weight="600" font-size="13" fill="#0284c7" text-anchor="middle">
      Clinical Cardio-Physician &amp; Non-Invasive Heart Specialist
    </text>

    <!-- Qualifications line -->
    <text x="250" y="82" font-family="'Poppins', sans-serif" font-weight="500" font-size="11" fill="#475569" text-anchor="middle">
      MBBS (MPSMC) • Dip. Cardiology (UN Mehta) • PGDCCP (NI) • AI (IIT-K)
    </text>

    <!-- Verified Badge -->
    <g transform="translate(195, 93)">
      <circle cx="0" cy="0" r="7" fill="#059669"/>
      <path d="M-3 0 L-1 2 L4 -3" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="14" y="3" font-family="'Poppins', sans-serif" font-weight="600" font-size="10" fill="#059669">NMC Registered • Non-Invasive OPD Care</text>
    </g>
  </g>
</svg>
